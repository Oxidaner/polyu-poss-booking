name: POSS Slot Monitor

on:
  schedule:
    # 常规轮询：每 5 分钟（蹲守提醒用）
    - cron: "*/5 * * * *"
    # 抢位预热：香港时间 08:29（UTC 00:29），让脚本准点 08:30:00 开火
    - cron: "29 0 * * *"
    # 抢位兜底重试：香港时间 08:35（UTC 00:35）
    - cron: "35 0 * * *"
  workflow_dispatch: # 允许手动触发，方便测试

permissions:
  contents: write # 需要写权限把 state.json / session.json 推回仓库

concurrency:
  group: poss-monitor
  cancel-in-progress: false # 上一次没跑完不重叠，排队即可

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          POSS_NETID: ${{ secrets.POSS_NETID }}
          POSS_PASSWORD: ${{ secrets.POSS_PASSWORD }}
          POSS_FB_USER_ID: ${{ vars.POSS_FB_USER_ID }}
          POSS_CONFIG: ${{ vars.POSS_CONFIG }}
          # 预订模板：两步流程用 BOOKING_CURL_STEP1 / STEP2；单步可直接用 BOOKING_CURL
          BOOKING_CURL: ${{ secrets.BOOKING_CURL }}
          BOOKING_CURL_STEP1: ${{ secrets.BOOKING_CURL_STEP1 }}
          BOOKING_CURL_STEP2: ${{ secrets.BOOKING_CURL_STEP2 }}
          # 或把模板文件路径存在 GitHub Variables 里（默认读取仓库根目录 booking.curl）
          BOOKING_CURL_FILE_STEP1: ${{ vars.BOOKING_CURL_FILE_STEP1 }}
          BOOKING_CURL_FILE_STEP2: ${{ vars.BOOKING_CURL_FILE_STEP2 }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python monitor.py

      - name: Commit state & session
        run: |
          git config user.name "poss-bot"
          git config user.email "actions@github.com"
          git add state.json session.json
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: update state [skip ci]"
            git push
          fi
