name: POSS Booking Backup

on:
  schedule:
    # 香港时间 08:20，给启动、登录和预检留出时间；GitHub 不保证准时启动。
    - cron: "20 0 * * *"
  workflow_dispatch: # 手动触发只验证账号和余额，不提交预订。

permissions:
  contents: write # 保存跨次运行的预订状态

concurrency:
  group: poss-booking
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Verify accounts or wait for release
        env:
          POSS_NETID: ${{ secrets.POSS_NETID }}
          POSS_PASSWORD: ${{ secrets.POSS_PASSWORD }}
          POSS_NETID_2: ${{ secrets.POSS_NETID_2 }}
          POSS_PASSWORD_2: ${{ secrets.POSS_PASSWORD_2 }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          for key in POSS_NETID POSS_PASSWORD POSS_NETID_2 POSS_PASSWORD_2; do
            if [ -z "${!key}" ]; then
              echo "$key 未配置"
              exit 1
            fi
          done
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python - <<'PY'
          from poss_client import account_ids_from_env, client_from_env, transport_reason
          import requests

          for account_id in account_ids_from_env():
              try:
                  client = client_from_env(account_id=account_id)
                  client.login()
                  balance = client.deposit_balance()
                  if balance is None:
                      raise ValueError("balance_unknown")
                  print(f"账号 {account_id}: 登录成功，余额 HK${balance['amount']}")
              except Exception as exc:
                  reason = (transport_reason(exc) if isinstance(exc, requests.RequestException)
                            else "balance_unknown" if isinstance(exc, ValueError)
                            else type(exc).__name__)
                  raise SystemExit(f"账号 {account_id}: 验证失败 ({reason})") from None
          PY
          else
            python -u monitor.py --wait --today-only
          fi

      # 保存结构化抢位诊断日志，不包含凭据或原始结果页。
      - name: Upload booking diagnostics
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: poss-dumps
          path: dumps/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit state
        if: github.event_name == 'schedule'
        run: |
          git config user.name "poss-bot"
          git config user.email "actions@github.com"
          if [ -f state.json ]; then git add state.json; fi
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: update state [skip ci]"
            git push
          fi
