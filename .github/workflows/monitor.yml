name: POSS Booking Backup

on:
  workflow_dispatch: # Cloudflare Cron 和手动启动都执行今天的等待放位和抢位流程。

permissions:
  contents: write # 保存跨次运行的预订状态

concurrency:
  group: poss-booking
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Wait for release and book
        env:
          POSS_NETID: ${{ secrets.POSS_NETID }}
          POSS_PASSWORD: ${{ secrets.POSS_PASSWORD }}
          POSS_NETID_2: ${{ secrets.POSS_NETID_2 }}
          POSS_PASSWORD_2: ${{ secrets.POSS_PASSWORD_2 }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          for key in POSS_NETID POSS_PASSWORD POSS_NETID_2 POSS_PASSWORD_2; do
            if [ -z "${!key}" ]; then
              echo "$key 未配置"
              exit 1
            fi
          done
          python -u monitor.py --wait --today-only

      - name: Refresh confirmed bookings from POSS
        if: always()
        env:
          POSS_NETID: ${{ secrets.POSS_NETID }}
          POSS_PASSWORD: ${{ secrets.POSS_PASSWORD }}
          POSS_NETID_2: ${{ secrets.POSS_NETID_2 }}
          POSS_PASSWORD_2: ${{ secrets.POSS_PASSWORD_2 }}
        run: python -u record_sync.py

      # 保存结构化抢位诊断日志，不包含凭据或原始结果页。
      - name: Upload booking diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poss-dumps
          path: dumps/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit state
        if: always()
        run: |
          git config user.name "poss-bot"
          git config user.email "actions@github.com"
          if [ -f state.json ]; then git add state.json; fi
          if [ -f bookings.json ]; then git add bookings.json; fi
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: update state [skip ci]"
            git push
          fi
